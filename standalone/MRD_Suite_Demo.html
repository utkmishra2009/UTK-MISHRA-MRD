l’s Operative Notes. Mark pages 1 & 3 Clear, page 2 “Unclear”, enter a remark and Reject.`,done:e=>He(e,`IP/26/10394`,`OP`)?.status===`QC Rejected`||(He(e,`IP/26/10394`,`OP`)?.version||1)>1},{role:`scanning`,page:`scanning`,params:{ip:`IP/26/10394`,tab:`rework`},text:`In the Rework tab, open the document, “Rescan page” on page 2, then “Resubmit to QC”.`,done:e=>(He(e,`IP/26/10394`,`OP`)?.version||1)>1},{role:`qc`,page:`qc`,params:{ip:`IP/26/10394`,type:`OP`},text:`Review again — all pages are now clear. Mark them Clear and Approve.`,done:e=>He(e,`IP/26/10394`,`OP`)?.status===`Approved`},{role:`qc`,page:`patient`,params:{ip:`IP/26/10394`,tab:`docs`},text:`Kiran’s record is now ready for coding; QC history is visible on the document.`}]},{id:`s5`,n:5,title:`Completeness & ICD coding`,patient:`Mohan Verma`,icon:`FileCheck2`,story:`Mohan Verma’s file has cleared QC, but the general consent form was never found. MRD must flag the deficiency to the responsible doctor, verify the response, code the diagnoses and close the record.`,actor:`Meera Iyer — MRD executive & coder`,action:`Raise a deficiency for General Consent, simulate the doctor’s response, verify it, add ICD-10 codes, mark complete and close.`,expected:`Record status goes Pending Review → Incomplete → Complete → Closed; the file is queued for storage.`,value:`No record is closed with missing consents — a key NABH medical-record audit finding.`,steps:[{role:`executive`,page:`coding`,params:{ip:`IP/26/10329`},text:`In the checklist, General Consent is missing. Click “Raise deficiency”, assign it to Dr. Arvind Menon and save.`,done:e=>e.deficiencies.some(e=>e.ip===`IP/26/10329`&&e.type===`GC`)},{role:`executive`,page:`coding`,params:{ip:`IP/26/10329`},text:`Click “Simulate response” (the doctor supplies the signed form), then “Verify & resolve”.`,done:e=>e.deficiencies.some(e=>e.ip===`IP/26/10329`&&e.type===`GC`&&e.status===`Resolved`)},{role:`executive`,page:`coding`,params:{ip:`IP/26/10329`},text:`Add codes (try the demo suggestions E11.1 and I10), then “Complete coding”.`,done:e=>Ve(e,`IP/26/10329`)?.coding.status===`Coded`},{role:`executive`,page:`coding`,params:{ip:`IP/26/10329`},text:`Click “Mark complete”, then “Close record”.`,done:e=>Ve(e,`IP/26/10329`)?.record.status===`Closed`}]},{id:`s6`,n:6,title:`Storage & retrieval`,patient:`Deepa Nair`,icon:`Archive`,story:`Deepa Nair’s closed file is sitting at the processing bay. It needs a permanent shelf position so that anyone can find it months later.`,actor:`Meera Iyer (MRD) → Dr. Vikram Rao (Department) → Meera Iyer`,action:`Assign a rack/shelf position, then raise a request for the file and see how MRD locates it.`,expected:`The file shows a location trail (Room › Rack › Shelf › Position); the request desk shows exactly where to pick it from.`,value:`Retrieval in minutes instead of hunting through racks — and no file is “available” when it is actually out.`,steps:[{role:`executive`,page:`storage`,params:{file:`PF-10301-V1`},text:`Deepa Nair’s file is in “Awaiting storage”. Select it, accept the suggested free position (or click one on the rack map) and press “Store here”.`,done:e=>!!e.files.find(e=>e.id===`PF-10301-V1`)?.location},{role:`requester`,page:`myrequests`,params:{newFor:`IP/26/10301`},text:`As Dr. Vikram Rao, request Deepa Nair’s complete physical file (enter a purpose and submit).`,done:e=>!!Ke(e,`IP/26/10301`)},{role:`executive`,page:`desk`,params:{ip:`IP/26/10301`},text:`At the Request Desk, open the request — the location trail tells you where to pick the file. Issue it.`,done:e=>[`Issued`,`Accepted`].includes(Ke(e,`IP/26/10301`)?.status)}]},{id:`s7`,n:7,title:`Department file request`,patient:`Ramesh Agarwal`,icon:`Send`,story:`Dr. Vikram Rao needs Ramesh Agarwal’s previous CABG admission file for today’s follow-up clinic.`,actor:`Dr. Vikram Rao → Meera Iyer → Dr. Vikram Rao`,action:`Request the complete file, issue it from MRD, and accept receipt in the department.`,expected:`Request gets a reference and TAT, file status becomes Issued with custodian and return date, and acceptance is recorded.`,value:`Every movement of a physical file is accountable, with a configured turnaround time.`,steps:[{role:`requester`,page:`myrequests`,params:{newFor:`IP/26/06120`},text:`Choose “Complete file”, Physical, a purpose and urgency, then submit.`,done:e=>!!Ke(e,`IP/26/06120`)},{role:`executive`,page:`desk`,params:{ip:`IP/26/06120`},text:`Open the new request and click “Issue file”. Confirm receiver and return period.`,done:e=>[`Issued`,`Accepted`].includes(Ke(e,`IP/26/06120`)?.status)},{role:`requester`,page:`myrequests`,params:{ip:`IP/26/06120`},text:`Back in Cardiology, click “Accept receipt”.`,done:e=>Ke(e,`IP/26/06120`)?.status===`Accepted`}]},{id:`s8`,n:8,title:`Missing / damaged file escalation`,patient:`Sushila Pandey`,icon:`FileWarning`,story:`Sushila Pandey’s file arrived at Cardiology OPD, but the consent pages appear to be missing.`,actor:`Dr. Vikram Rao → Dr. Sunita Deshpande (MRD Supervisor)`,action:`Report the discrepancy on receipt; then, as supervisor, review and resolve the escalation.`,expected:`An escalation is raised with reason and responsible user; resolution notes close it and update the request.`,value:`Missing documents are surfaced immediately and owned by a senior person — not discovered during an audit.`,steps:[{role:`requester`,page:`myrequests`,params:{req:`RQ-26-0311`},text:`Open the issued request for Sushila Pandey and click “Report discrepancy”. Choose “Missing documents” and describe it.`,done:e=>!!Ue(e,`RQ-26-0311`)?.discrepancy},{role:`supervisor`,page:`escalations`,params:{ref:`RQ-26-0311`},text:`As supervisor, open the discrepancy escalation, acknowledge it, then resolve with notes.`,done:e=>Ue(e,`RQ-26-0311`)?.discrepancy?.status===`Resolved`}]},{id:`s9`,n:9,title:`TAT breach & escalation`,patient:`Vinod Chavan`,icon:`Siren`,story:`An urgent request for Vinod Chavan’s file (4-hour TAT) is still unfulfilled. Watch it breach and escalate automatically.`,actor:`System (TAT rules) → MRD Supervisor`,action:`Use the demo clock to move time forward by 1–2 hours; then check the escalation queue.`,expected:`The request turns Overdue, an escalation is created by the TAT rule, and it auto-closes once MRD issues the file.`,value:`Supervisors see breaches as they happen — no one has to remember to chase.`,steps:[{role:`supervisor`,page:`escalations`,params:{},text:`Click “+1 h” on the demo clock in the header twice (or until the request for RQ-26-0312 breaches).`,done:e=>e.escalations.some(e=>e.key===`RQ:RQ-26-0312`)},{role:`supervisor`,page:`escalations`,params:{ref:`RQ-26-0312`},text:`The breach is now in the escalation queue with level, responsible user and overdue time. Acknowledge it.`,done:e=>e.escalations.some(e=>e.key===`RQ:RQ-26-0312`&&e.status!==`Open`)},{role:`executive`,page:`desk`,params:{ip:`IP/26/05201`},text:`Fulfil it: issue Vinod Chavan’s file. The escalation closes automatically.`,done:e=>[`Issued`,`Accepted`].includes(Ue(e,`RQ-26-0312`)?.status)}]},{id:`s10`,n:10,title:`Return & closure`,patient:`Arjun Malhotra`,icon:`PackageCheck`,story:`Cardiology has finished with Arjun Malhotra’s file and sends it back. MRD inspects it and returns it to the exact shelf position.`,actor:`Dr. Vikram Rao → Meera Iyer`,action:`Return the file from the department; inspect and restore it at the MRD Request Desk.`,expected:`Request closes, file becomes Available at its recorded location, and the loan is in the audit trail.`,value:`Closes the loop — files come back complete and go back to the right place.`,steps:[{role:`requester`,page:`myrequests`,params:{req:`RQ-26-0313`},text:`Open Arjun Malhotra’s request and click “Return file”.`,done:e=>[`Return Submitted`,`Closed`].includes(Ue(e,`RQ-26-0313`)?.status)},{role:`executive`,page:`desk`,params:{tab:`returns`,ip:`IP/26/08012`},text:`In Returns, open it, tick the inspection checks and click “Accept & restore”.`,done:e=>Ue(e,`RQ-26-0313`)?.status===`Closed`},{
